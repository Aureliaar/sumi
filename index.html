<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumi</title>
<meta name="description" content="A real-time ink and brush simulation for writing calligraphy with your finger.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖌️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="paper" aria-label="Paper. Press and drag to write with the brush."></canvas>

<div id="guide" aria-hidden="true">
  <div class="sheet">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect x="0" y="0" width="100" height="100"/>
      <line x1="50" y1="0" x2="50" y2="100"/>
      <line x1="0" y1="50" x2="100" y2="50"/>
      <line x1="0" y1="0" x2="100" y2="100"/>
      <line x1="100" y1="0" x2="0" y2="100"/>
    </svg>
    <div class="glyph" id="glyph">永</div>
  </div>
</div>

<p id="hint">Press and drag to write. Slow strokes swell, quick ones thin out, and lifting mid‑stroke flicks a tail.</p>

<nav class="bar" aria-label="Brush tools">
  <button id="bGuide" aria-pressed="false" aria-label="Practice guide" title="Practice guide"><span class="g">永</span></button>
  <button id="bNext" hidden aria-label="Next practice character" title="Next character">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.2h-4.2"/></svg>
  </button>
  <span class="sep"></span>
  <button id="bSize" aria-label="Brush size: medium" title="Brush size">
    <svg viewBox="0 0 24 24"><circle id="sizeDot" cx="12" cy="12" r="5" fill="currentColor"/></svg>
  </button>
  <button id="bTone" aria-label="Ink: dark" title="Ink strength">
    <svg viewBox="0 0 24 24"><circle id="toneDot" cx="12" cy="12" r="7" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <span class="sep"></span>
  <button id="bSeal" aria-pressed="false" aria-label="Press a seal" title="Seal"><span class="seal-ico">印</span></button>
  <span class="sep"></span>
  <button id="bUndo" aria-label="Undo" title="Undo" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5 4.5 11 9 15.5"/><path d="M5 11h9.5a4.5 4.5 0 0 1 0 9H11"/></svg>
  </button>
  <button id="bClear" aria-label="New sheet" title="New sheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3.5h7.5l4.5 4.5v12.5H6z"/><path d="M13.5 3.5V8H18"/></svg>
  </button>
</nav>

<script src="sumi.js"></script>
</body>
</html>
