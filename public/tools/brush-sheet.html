<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brush Sheet</title>
<style>
  :root{--bg:#f4efe6;--fg:#26221c;--mute:#7a7266;--line:#d9d1c3;--panel:#efe9de;--accent:#b8402a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:20px 16px 40px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--mute);margin:0 0 14px;max-width:80ch}
  .layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start;max-width:1560px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  aside{background:var(--panel);border:1px solid var(--line);padding:12px 14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 0 6px}
  aside h2:first-child{margin-top:0}
  .row{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin:6px 0 2px}
  .row label{font-size:13px}
  .row output{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mute)}
  .row output.changed{color:var(--accent);font-weight:600}
  .row input{grid-column:1 / -1;width:100%;accent-color:var(--fg);margin:2px 0 0}
  .hint{grid-column:1 / -1;font-size:11px;color:var(--mute);line-height:1.3}
  .buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
  button.ghost{background:transparent;color:var(--fg)}
  button:disabled{opacity:.4;cursor:default}
  #status{color:var(--mute);font-size:13px;margin:0 0 10px;min-height:1.4em}
  #grid{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:8px;align-items:center}
  .ch{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;text-align:center}
  .rh{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;text-align:right;max-width:5.5em;line-height:1.2}
  .cell{aspect-ratio:1;background:#ede8dd;border:1px solid var(--line);position:relative}
  .cell img{display:block;width:100%;height:100%}
  .cell span{position:absolute;left:6px;top:4px;font-size:11px;color:var(--mute)}
  .cell.stale img{opacity:.45}
  #frame{position:absolute;left:-10000px;top:0;width:560px;height:560px;border:0}
</style>
</head>
<body>
<h1>Brush sheet</h1>
<p class="sub">Four drawings (rows) at four ink loads (columns), each through the bristle brush on wet paper and left to dry. The kanji are drawn with one brush load for the whole character. Moving a slider redraws the sheet; settings are remembered in this browser.</p>
<div class="layout">
  <aside>
    <div id="controls"></div>
    <div class="buttons">
      <button id="copy" class="ghost" title="Copy the changed settings as JSON">Copy settings</button>
      <button id="reset" class="ghost">Reset</button>
    </div>
  </aside>
  <main>
    <p id="status">Loading…</p>
    <div id="grid"></div>
  </main>
</div>
<iframe id="frame" src="../index.html?harness&amp;lab" aria-hidden="true" tabindex="-1"></iframe>
<script src="sheet.js"></script>
<script>
const $ = s => document.querySelector(s);
const frame = $('#frame'), grid = $('#grid'), status = $('#status');
const {ROWS, COLS, cell} = SUMI_SHEET;

/* Sliders. `brush` params go into every brush; the rest scale the whole sheet. Defaults come from brush.js. */
const PARAMS = [
  {group: 'Sheet'},
  {key: 'size', label: 'Brush size ×', min: 0.5, max: 1.8, step: 0.05, def: 1, brush: true},
  {key: 'speed', label: 'Speed ×', min: 0.3, max: 3, step: 0.05, def: 1},
  {key: 'load', label: 'Ink load ×', min: 0.25, max: 2.5, step: 0.05, def: 1, hint: 'Multiplies every column’s dip'},
  {group: 'Tuft'},
  {key: 'length', label: 'Tip length', min: 1, max: 3.5, step: 0.05, brush: true, hint: 'Belly to tip, in belly radii'},
  {key: 'tilt', label: 'Resting tilt°', min: -180, max: 180, step: 5, brush: true, hint: 'Where the tip points at rest (kanji only; the ensō and flourish use an upright brush)'},
  {key: 'stiffness', label: 'Tip spring', min: 0, max: 0.12, step: 0.005, brush: true},
  {key: 'bristles', label: 'Bristles', min: 80, max: 600, step: 20, brush: true},
  {key: 'clumps', label: 'Clumps', min: 4, max: 20, step: 1, brush: true},
  {group: 'Ink'},
  {key: 'ink', label: 'Ink density', min: 0.8, max: 2, step: 0.05, brush: true, hint: 'About 1.3 fully covers the paper'},
  {key: 'use', label: 'Ink use', min: 0.005, max: 0.06, step: 0.001, brush: true, hint: 'Share of a bristle’s load per brush radius travelled'},
  {key: 'edgeUse', label: 'Edge dries faster', min: 0, max: 4, step: 0.1, brush: true},
  {key: 'clumpVar', label: 'Clump unevenness', min: 0, max: 1, step: 0.05, brush: true, hint: 'Thin clumps run dry first'},
  {group: 'Texture'},
  {key: 'split', label: 'Wet splits', min: 0, max: 1.5, step: 0.05, brush: true, hint: 'White streaks between clumps while inked'},
  {key: 'splitScale', label: 'Split length', min: 40, max: 400, step: 10, brush: true, hint: 'px of travel over which a split opens and closes'},
  {key: 'lift', label: 'Speed lift', min: 0, max: 0.8, step: 0.02, brush: true, hint: 'Pressure a fast brush loses'},
  {key: 'fast', label: 'Fast at (px/ms)', min: 0.3, max: 5, step: 0.1, brush: true},
  {group: 'Landing'},
  {key: 'land', label: 'Staggered landing', min: 0, max: 3, step: 0.1, brush: true},
  {key: 'splay', label: 'Landing scatter', min: 0, max: 0.5, step: 0.01, brush: true},
  {key: 'flare', label: 'Outer hair flare', min: 0, max: 1, step: 0.02, brush: true},
];
const STORE = 'sumi.brushSheet.v1';
let values = {};
try { values = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (_) { values = {}; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(values)); } catch (_) {} };
const fmt = (p, v) => p.step >= 1 ? String(Math.round(v)) : (+v).toFixed(p.step < 0.01 ? 3 : 2);

function buildControls(defaults){
  const box = $('#controls');
  box.innerHTML = '';
  for (const p of PARAMS){
    if (p.group){ box.insertAdjacentHTML('beforeend', `<h2>${p.group}</h2>`); continue; }
    if (p.def === undefined) p.def = defaults[p.key];
    const v = values[p.key] ?? p.def, id = 'p_' + p.key;
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label for="${id}">${p.label}</label><output id="o_${p.key}"></output>
      <input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}">` +
      (p.hint ? `<span class="hint">${p.hint}</span>` : '');
    box.appendChild(row);
    const input = row.querySelector('input'), out = row.querySelector('output');
    const show = () => { out.textContent = fmt(p, input.value); out.classList.toggle('changed', +input.value !== +p.def); };
    show();
    input.addEventListener('input', () => { show(); grid.querySelectorAll('.cell').forEach(c => c.classList.add('stale')); });
    input.addEventListener('change', () => {
      if (+input.value === +p.def) delete values[p.key]; else values[p.key] = +input.value;
      save(); schedule();
    });
  }
}
function settings(){
  const brush = {};
  for (const p of PARAMS) if (p.key && p.brush && values[p.key] !== undefined) brush[p.key] = values[p.key];
  return {brush, speed: values.speed ?? 1, ink: values.load ?? 1};
}

grid.innerHTML = '<div></div>' + COLS.map(c => `<div class="ch">${c.name}</div>`).join('') +
  ROWS.map((r, i) => `<div class="rh">${r.name}</div>` +
    COLS.map((c, j) => `<div class="cell" id="c${i}${j}"><span>${i * 4 + j + 1}</span></div>`).join('')).join('');
function toImage(r){
  const c = document.createElement('canvas'); c.width = r.w; c.height = r.h;
  const ctx = c.getContext('2d'), img = ctx.createImageData(r.w, r.h);
  for (let y = 0; y < r.h; y++) img.data.set(r.px.subarray((r.h - 1 - y) * r.w * 4, (r.h - y) * r.w * 4), y * r.w * 4);
  ctx.putImageData(img, 0, 0);
  const im = new Image(); im.src = c.toDataURL('image/png'); im.alt = ''; return im;
}

// A slider change restarts the sheet; a render in progress stops after its current cell.
let generation = 0, running = false, timer = 0;
function schedule(){ clearTimeout(timer); timer = setTimeout(render, 150); }
async function render(){
  const gen = ++generation;
  if (running) return;          // the running pass notices the new generation and starts over
  running = true;
  try {
    let again = true;
    while (again){
      again = false;
      const mine = generation, w = frame.contentWindow, {w: cw, h: ch} = w.__sumi.size();
      const opts = Object.assign(settings(), {sweeps: w.SUMI.sweeps, styles: w.SUMI.styles});
      for (let i = 0; i < ROWS.length && !again; i++) for (let j = 0; j < COLS.length; j++){
        if (generation !== mine){ again = true; break; }
        status.textContent = `Drawing ${i * 4 + j + 1} of 16…`;
        const r = await w.__sumi.play(cell(i, j, cw, ch, opts), {});
        if (generation !== mine){ again = true; break; }
        const el = $(`#c${i}${j}`), old = el.querySelector('img');
        if (old) old.remove();
        el.prepend(toImage(r)); el.classList.remove('stale');
      }
    }
    status.textContent = 'Done.';
  } catch (err) {
    console.error(err); status.textContent = 'Drawing failed: ' + err.message;
  } finally { running = false; }
}

$('#reset').addEventListener('click', () => { values = {}; save(); buildControls(frame.contentWindow.SumiBrush.DEFAULTS); schedule(); });
$('#copy').addEventListener('click', async () => {
  const text = JSON.stringify(values);
  try { await navigator.clipboard.writeText(text); status.textContent = 'Copied: ' + text; }
  catch (_) { status.textContent = text; }
});
frame.addEventListener('load', async () => {
  const w = frame.contentWindow;
  for (let i = 0; i < 100 && !w.__sumi; i++) await new Promise(r => setTimeout(r, 50));
  if (!w.__sumi) { status.textContent = 'The brush did not start (WebGL 2 missing?).'; return; }
  buildControls(w.SumiBrush.DEFAULTS);
  render();
});
</script>
</body>
</html>
